name: Fork build (external transports)

# Builds the fork's feature branches on a standard GitHub runner and uploads a debug APK.
on:
  push:
    branches:
      - 'feature/**'
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build debug APK
        run: >
          ./gradlew --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g"
          :Signal-Android:assemblePlayProdDebug

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signal-sms-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive reports for failed build
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reports
          path: |
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore
